<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Mini Live Editor</title>

    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.56.0/theme/material.min.css" />


    <!-- Your styles -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div class="editors">
        <button id="resetBtn" class="reset">Reset</button>

        <div class="tabs">
            <button class="tab active" data-tab="html">HTML</button>
            <button class="tab" data-tab="css">CSS</button>
            <button class="tab" data-tab="js">JS</button>
            <button class="tab" data-tab="cheatsheet">CHEATSHEET</button>
        </div>

        <div class="panels">
            <div id="html" class="panel editor active"></div>
            <div id="css" class="panel editor"></div>
            <div id="js" class="panel editor"></div>
            <div id="cheatsheet" class="panel editor"></div>
        </div>
    </div>

    <iframe id="preview"></iframe>



    <!-- jQuery (for your future jQuery crash course) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- CodeMirror -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>

    <!-- Your JS -->
    <script src="assets/js/script.js"></script>
</body>

</html>
